name: Test

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]
  workflow_dispatch:


env:
  CARGO_TERM_COLOR: always
  COLOR: always

jobs:
  nextest-with-timeout:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install rust
        run: rustup install nightly && rustup default nightly
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-nextest
      - name: Build tests
        run: cargo build --workspace --tests
      - name: Invoke nextest wrapper
        run: cargo run -p nextest-issue-2295 nextest
        env:
          NEXTEST_LOG: trace
        timeout-minutes: 3
      - name: Output log
        run: |
          echo "Dumping log"
          echo "=================="
          cat test.stderr.log
        if: always()

  nextest-without-timeout:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install rust
        run: rustup install nightly && rustup default nightly
