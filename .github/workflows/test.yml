name: Test

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]
  workflow_dispatch:


env:
  CARGO_TERM_COLOR: always
  COLOR: always
  LLVM_SYS_201_PREFIX: ${{ github.workspace }}/LLVM-20.1.3-Linux-X64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt update && sudo apt install clang ninja-build
      - name: Install rust
        run: rustup install nightly && rustup default nightly
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Cache llvm
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          key: new-built-llvm
          path: |
            LLVM-20.1.3-Linux-X64
      - name: Download LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.3/llvm-20.1.3.src.tar.xz  -o LLVM.tar.xz
      - name: Extract LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          tar -xf LLVM.tar.xz
      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          ls -la
          cd llvm-20.1.3.src
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_ASSERTIONS=ON -DCMAKE_INSTALL_PREFIX=$LLVM_SYS_201_PREFIX ../
          cmake --build . --target install
      - name: List llvm
        run: |
          ls -la
          ls LLVM-20.1.3-Linux-X64
          ls LLVM-20.1.3-Linux-X64/bin
          ls LLVM-20.1.3-Linux-X64/lib
          echo "..."
          LLVM-20.1.3-Linux-X64/bin/llvm-config --system-libs --link-static
      - name: Save llvm
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: new-built-llvm
          path: |
            LLVM-20.1.3-Linux-X64
      - name: Install cargo-nextest
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-nextest
      - name: Build tests
        run: cargo build --workspace --tests
      - name: Invoke nextest wrapper
        run: cargo run -p nextest-issue-2295
