name: Test

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]
  workflow_dispatch:


env:
  CARGO_TERM_COLOR: always
  COLOR: always
  LLVM_SYS_201_PREFIX: ${{ github.workspace }}/llvm

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install rust
        run: rustup install nightly && rustup default nightly
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Download LLVM
        run: |
          curl https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.3/LLVM-20.1.3-Linux-X64.tar.xz -o LLVM.tar.xz
          tar -xf LLVM.tar.xz
          ls -la
          ls llvm
      - name: Install cargo-nextest
        uses: baptiste0928/cargo-install@v1
        with:
          crate: cargo-nextest
          args: --locked
      - name: Invoke nextest wrapper
        run: cargo run -p nextest-issue-2295
